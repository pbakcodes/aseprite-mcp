[project]
name = "aseprite-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["aseprite_mcp"]
branch = true
# Only the console-script shim is omitted: it is a four-line entrypoint whose
# body is an `if __name__ == "__main__"` guard that starts the stdio server,
# so it can never execute under pytest. Every functional module stays measured,
# including the weakly covered ones.
omit = ["aseprite_mcp/__main__.py"]

[tool.coverage.report]
show_missing = true
precision = 2
# The live-Aseprite suite measures ~98% combined statement+branch coverage.
# 93 is the contracted floor with a deliberate margin: it fails on a real
# regression without tripping on run-to-run variation in the handful of
# environment-dependent branches (font discovery, /proc process identity).
fail_under = 93
